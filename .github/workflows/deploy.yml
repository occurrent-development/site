name: Build and deploy

# Cloudflare's build image has no Racket, so the site is built here and
# deployed to the `site` Worker with wrangler. Every branch builds; only
# main deploys.

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # "last revised" dates come from git history (REV-1)

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          variant: CS
          distribution: minimal

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/racket
          key: racket-9.3-${{ hashFiles('.github/workflows/deploy.yml') }}

      - name: Install Pollen
        run: raco pkg install --auto --batch --skip-installed --no-docs pollen

      - name: Install fonttools, Pillow and avifenc
        run: |
          python3 -m pip install --user -r tools/requirements.txt
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libavif-bin

      # VAL-3: the anchors published by the last deploy. A failed fetch only
      # skips the check; it never fails the build.
      - name: Fetch deployed anchors
        run: curl -sf https://occurrentdevelopment.com/data/anchors.json -o data/anchors-deployed.json || true

      - name: Build (tests, fonts, render, assemble)
        run: make

      - uses: actions/upload-artifact@v7
        with:
          name: public
          path: public/
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: public
          path: public/

      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
