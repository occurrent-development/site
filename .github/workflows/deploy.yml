name: Build and deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          variant: CS
          distribution: minimal

      - name: Install Pollen
        run: raco pkg install --auto --batch --skip-installed pollen

      - name: Check Racket and Pollen
        run: racket -l racket/base -l pollen/decode -e '(displayln (version))'

      - name: Stamp build
        run: echo "<!-- built by GitHub Actions from ${GITHUB_SHA} -->" >> public/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: public
          path: public/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: public
          path: public/

      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
