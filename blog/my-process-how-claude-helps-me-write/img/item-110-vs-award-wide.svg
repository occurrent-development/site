<title id="fig2-wide-title">Medicare item 110 fee, receptionist award rate and consumer prices, indexed to 1 July 2011</title>
<desc id="fig2-wide-desc">Line chart from 1 July 2011 to September 2026, each series set to 100 in 2011. The receptionist award hourly rate rose 63 per cent, consumer prices 51 per cent (the last four quarters are derived) and the item 110 schedule fee 26 per cent. The fee did not change from November 2012 to June 2018.</desc>
